<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>필드 트레이너</title>
<style>
:root{--bg:#EEF1EC;--sf:#fff;--sf2:#F4F6F2;--line:#D8DED3;--fg:#17201A;--mu:#5C6A5F;--ac:#1F7A43;--ink:#fff;--soft:#DDEFE3;--red:#C93B34;--yel:#C99700;
--font:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1411;--sf:#18201B;--sf2:#1F2922;--line:#2C382F;--fg:#E8EFEA;--mu:#9AAA9E;--ac:#4FCB7E;--ink:#07120B;--soft:#17301F;--red:#FF6A61;--yel:#F2C94C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1411;--sf:#18201B;--sf2:#1F2922;--line:#2C382F;--fg:#E8EFEA;--mu:#9AAA9E;--ac:#4FCB7E;--ink:#07120B;--soft:#17301F;--red:#FF6A61;--yel:#F2C94C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font)}
#app{max-width:560px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.big{font-size:34px;font-weight:800;line-height:1.1}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--sf2);border-radius:12px;padding:10px 12px;cursor:pointer}
button.pri{background:var(--ac);color:var(--ink);border-color:var(--ac);font-weight:700;width:100%;padding:14px;font-size:16px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.chk:first-of-type{border-top:0}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;margin-top:1px}
.on .box{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.dots{display:flex;gap:6px}.dot{flex:1;text-align:center;font-size:12px;color:var(--mu)}
.dot i{display:block;height:28px;border-radius:8px;background:var(--sf2);border:1px solid var(--line);margin-bottom:3px}
.dot.on i{background:var(--ac);border-color:var(--ac)}.dot.t b{color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border-radius:20px;padding:8px 12px;font-size:14px}.chip.on{background:var(--soft);border-color:var(--ac);color:var(--ac);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rb{padding:16px 8px;font-size:16px;font-weight:700}.rb.g{background:var(--soft);border-color:var(--ac);color:var(--ac);grid-column:1/-1}
.bar{height:10px;border-radius:6px;background:var(--sf2);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--ac)}
.bar.m i{background:var(--red)}
.prog{height:6px;background:var(--sf2);border-radius:4px;overflow:hidden;margin-bottom:12px}.prog i{display:block;height:100%;background:var(--ac)}
textarea{width:100%;min-height:64px;font:inherit;color:inherit;background:var(--sf2);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;font-size:14px;padding:10px 4px;color:var(--mu)}nav button.on{color:var(--ac);font-weight:800}
.cue{background:var(--sf2);border-radius:10px;padding:10px 12px;margin-top:10px}
.li{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.li:first-child{border-top:0}
.cue.ob{border:1px solid var(--red);color:var(--red);font-weight:700}input.pt{flex:1;min-width:0;font:inherit;color:inherit;background:var(--sf2);border:1px solid var(--line);border-radius:10px;padding:9px}
.hr{display:grid;grid-template-columns:24px 1fr 1.4fr repeat(3,1fr);gap:6px;margin-bottom:6px;align-items:center;text-align:center}.hr input,.hr select,.f{width:100%;min-width:0;font:inherit;color:inherit;background:var(--sf2);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center}.f{text-align:left;padding:10px;margin-bottom:8px}
</style></head><body>
<div id="app"></div>
<nav><button data-a="tab" data-v="today">오늘</button><button data-a="tab" data-v="run">필드 연습</button><button data-a="tab" data-v="screen">스크린</button><button data-a="tab" data-v="log">기록</button></nav>
<script>
var MISS=["뒷땅","탑볼","슬라이스","훅"],SIDES=["왼쪽 끝","중앙","오른쪽 끝"],TYPES=["티샷","세컨드","어프로치","쇼트게임"];
var WARM=["스트레칭: 어깨, 허리, 손목, 고관절을 먼저 풀기","웨지로 시작: 30~40m 짧은 스윙 10개","웨지 스윙 크기를 풀스윙까지 점차 키우기","클럽 순서: 짝수 클럽 위주로 번갈아 (드라이버부터 잡지 않기)","프리샷 루틴 5단계를 눈으로 한 번 훑기"];
var ROUT=["타깃 설정","페이스 정렬","호흡·이미지","빈 스윙","멈춤 없이 샷"];
var ROD=["공 뒤로 걸어가 구체적 목표물(나무, 벙커 끝, 표지판)을 정합니다.","몸보다 클럽 페이스를 먼저 목표 방향에 맞춥니다.","1~2초 심호흡하며 탄도와 구질을 머릿속에 그립니다.","1~2회, 리듬과 템포만 확인합니다.","어드레스 후 멈추지 않고 템포대로 칩니다."];
var TIPS=["스크린 매트는 항상 정면이라 에이밍 감각이 무뎌집니다. 샷마다 타깃을 바꾸세요.","공이 굴러와도 바로 치지 마세요. 한 걸음 물러나 루틴을 처음부터 다시 하세요.","같은 클럽을 연속으로 잡지 마세요. 필드에서는 한 홀에 클럽이 계속 바뀝니다.","화면 수치만 보지 말고 센서 값(클럽 패스, 페이스 앵글)을 확인하세요.","어프로치는 화면 거리에 맞춘 툭 치는 스윙이 아니라, 필드에서 보낸 백스윙 크기로 치세요.","실제 잔디(파3 코스 등)에서 한 번 쳐보면 뒷땅 감각이 확 달라집니다."];
var TEEC=["맞바람: 낮고 짧게 컨트롤하세요.","페어웨이가 좁습니다. 중앙만 보세요.","평지 티샷: 템포 80%로 정확히."];
var LIE=["평지 라이","내리막 라이: 어깨를 경사에 맞추세요.","오르막 라이: 경사를 따라 치세요.","러프: 공 뒤 수건을 건드리지 않게 치세요.","맞바람: 한 클럽 길게, 낮게."];
var SG="화면 거리 숫자가 아니라, 필드에서 이 거리를 보낼 때의 백스윙 크기와 낙하 지점을 먼저 상상하고 치세요.";
var RX={"뒷땅":"공 뒤 수건 드릴로 공 앞 바닥을 치세요. 센서의 체중 이동 그래프에서 체중이 뒤에 남지 않는지 확인하세요.","탑볼":"임팩트까지 가슴 높이를 유지하세요. 체중 이동 그래프로 체중이 뒤에 남는지도 확인하세요.","슬라이스":"센서의 클럽 패스(Out-to-In 여부)와 페이스 앵글을 확인하고, 안에서 밖으로 지나가는 궤도를 천천히 연습하세요.","훅":"센서의 클럽 패스(In-to-Out 과다)와 페이스 앵글을 확인하고, 손보다 몸통 회전으로 치세요."};
var tab="today",run=null,done=null,PT=["5","10","15"];
function ld(){try{var s=JSON.parse(localStorage.getItem("gft"));if(s&&s.sessions){s.putt=s.putt||{};return s}}catch(e){}return{sessions:[],checks:{},notes:{},putt:{}}}
var S=ld();
function sv(){try{localStorage.setItem("gft",JSON.stringify(S))}catch(e){}if(DB){clearTimeout(tmr);tmr=setTimeout(function(){DB.doc(base()+"/train").set(S).catch(function(){CLOUD=false})},700)}}
function dk(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pick(a){return a[Math.random()*a.length|0]}
function ri(a,b){return a+(Math.random()*(b-a+1)|0)}
function pct(a,b){return b?Math.round(a/b*100):0}
function active(k){var c=S.checks[k];return S.sessions.some(function(s){return s.date==k})||(c&&c.some(Boolean))}
function streak(){var d=new Date(),n=0;if(!active(dk(d)))d.setDate(d.getDate()-1);while(active(dk(d))){n++;d.setDate(d.getDate()-1)}return n}
function cf(d){return d>=180?"5번 아이언":d>=160?"6번 아이언":d>=145?"7번 아이언":d>=130?"8번 아이언":d>=115?"9번 아이언":d>=90?"피칭웨지":d>=60?"52도 웨지":"56도 웨지"}
function plan(){var P=[4,3,5,4,4,3,5,4,4],o=[],last="";
 function add(h,p,ty,club,dist,L,cue){var a;do{a=pick(SIDES)}while(a==last);last=a;var ob=ty!="쇼트게임"&&Math.random()<.25;
  o.push({h:h,par:p,len:L,ty:ty,club:club,dist:dist,aim:a,ob:ob?pick(["왼쪽","오른쪽"]):"",cue:cue})}
 P.forEach(function(p,i){var h=i+1,L=p==3?5*ri(28,38):p==4?5*ri(64,80):5*ri(96,106);
  if(p==3){add(h,p,"티샷",cf(L),L,L,pick(TEEC));add(h,p,"쇼트게임",pick(["피칭웨지","56도 웨지"]),ri(8,25),L,SG)}
  else{var d=5*ri(37,46),rem=L-d;add(h,p,"티샷",pick(["드라이버","드라이버","3번 우드"]),d,L,pick(TEEC));
   if(p==5){var d2=5*ri(30,36);add(h,p,"세컨드",pick(["3번 우드","5번 아이언"]),d2,L,pick(LIE));rem-=d2}
   rem=Math.max(70,Math.min(rem,190));add(h,p,"어프로치",cf(rem),rem,L,pick(LIE));
   if(i%3==0)add(h,p,"쇼트게임",pick(["피칭웨지","56도 웨지"]),ri(8,25),L,SG)}});return o}
function wl(){var k=dk(),c=S.checks[k]||[0,0,0,0,0];return WARM.map(function(t,i){return '<div class="chk '+(c[i]?"on":"")+'" data-a="chk" data-v="'+i+'"><span class="box">'+(c[i]?"✓":"")+'</span><span>'+t+'</span></div>'}).join("")}
function vToday(){var k=dk(),n=streak(),w=["일","월","화","수","목","금","토"],h="";
 for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);h+='<div class="dot '+(active(dk(d))?"on ":"")+(i==0?"t":"")+'"><i></i><b>'+w[d.getDay()]+'</b></div>'}
 var pt=PT.map(function(m){return '<div class="row" style="margin-bottom:6px"><span style="width:38px">'+m+'m</span><input class="pt" data-p="'+m+'" placeholder="예: 오른발 엄지까지" value="'+esc(S.putt[m]||"")+'"></div>'}).join("");
 return '<h1>필드 트레이너</h1><div class="card"><div class="row sp"><div><div class="mu">연속 연습</div><div class="big">'+n+'일</div></div><div class="mu" style="text-align:right">총 '+S.sessions.length+'회 세션</div></div><div class="dots" style="margin-top:12px">'+h+'</div></div>'
 +'<div class="card"><h2>오늘의 한 가지</h2><div>'+TIPS[new Date().getDate()%TIPS.length]+'</div></div>'
 +'<div class="card"><h2>연습 흐름</h2><div class="mu">1 몸풀기 → 2 프리샷 루틴 5단계 → 3 가상 9홀(거리, 클럽, 타깃, OB 랜덤) → 4 쇼트게임과 퍼팅 거리감, 센서 피드백</div></div>'
 +'<div class="card"><h2>1단계 몸풀기</h2>'+wl()+'</div>'
 +'<button class="pri" data-a="start">필드 연습 시작</button>'
 +'<div class="card" style="margin-top:12px"><h2>내 퍼팅 스트로크 공식</h2><div class="mu" style="margin-bottom:8px">거리별 백스윙 크기를 적어두고 샷마다 맞춰보세요.</div>'+pt+'</div>'
 +'<div class="card"><h2>오늘 한 줄 메모</h2><textarea id="note" placeholder="오늘 느낀 점, 내일 고칠 것">'+esc(S.notes[k]||"")+'</textarea></div>'}
function vRun(){
 if(done)return vDone();
 if(!run)return '<h1>필드 연습</h1><div class="card"><p>몸풀기를 마치고 가상 9홀을 돕니다. 홀마다 티샷, 어프로치, 쇼트게임이 거리와 함께 주어지고, 프리샷 루틴 5단계를 지킨 뒤 결과를 기록합니다.</p><p class="mu">약 23샷, 30~40분.</p></div><button class="pri" data-a="start">시작하기</button>';
 if(run.ph=="warm"){var rl=ROUT.map(function(t,i){return '<div class="li"><span><b>'+(i+1)+'. '+t+'</b></span></div><div class="mu" style="margin:-4px 0 6px">'+ROD[i]+'</div>'}).join("");
  return '<h1>몸풀기와 루틴</h1><div class="card"><h2>1단계 몸풀기</h2>'+wl()+'</div><div class="card"><h2>2단계 프리샷 루틴</h2>'+rl+'</div><button class="pri" data-a="go">가상 9홀 시작</button>'}
 var s=run.plan[run.i],ch=ROUT.map(function(t,i){return '<button class="chip '+(run.ch[i]?"on":"")+'" data-a="chip" data-v="'+i+'">'+(run.ch[i]?"✓ ":"")+(i+1)+" "+t+'</button>'}).join("");
 var rb=MISS.map(function(m){return '<button class="rb" data-a="res" data-v="'+m+'">'+m+'</button>'}).join("");
 var info=s.ty=="티샷"?"홀 길이 "+s.len+"m":(s.ty=="쇼트게임"?"그린까지 "+s.dist+"m":"남은 거리 "+s.dist+"m");
 return '<div class="row sp mu"><span>'+s.h+'번 홀 · 파'+s.par+' · '+s.len+'m</span><span>'+(run.i+1)+' / '+run.plan.length+'</span></div><div class="prog"><i style="width:'+pct(run.i,run.plan.length)+'%"></i></div>'
 +'<div class="card"><div class="mu">'+s.ty+'</div><div class="big">'+s.club+'</div><div class="mu" style="margin-top:2px">'+info+'</div>'
 +'<div class="cue"><b>타깃</b> '+s.aim+'. 화면 속 나무나 벙커 끝 같은 지형지물을 하나 정하세요.</div>'
 +(s.ob?'<div class="cue ob">⚠ '+s.ob+'쪽 OB. 미스는 벌타 1</div>':'')+'<div class="cue">'+s.cue+'</div></div>'
 +'<div class="mu">프리샷 루틴 (공 뒤에서 시작)</div><div class="chips">'+ch+'</div><div class="mu" style="margin-bottom:8px">임팩트 기준으로 결과를 고르세요</div><div class="grid"><button class="rb g" data-a="res" data-v="굿">좋은 샷</button>'+rb+'</div>'
 +'<div class="row" style="margin-top:12px"><button data-a="undo">되돌리기</button><button data-a="quit">그만하기</button></div>'}
function sum(sh){var m={},g=0,r=0,pen=0,ty={};MISS.forEach(function(x){m[x]=0});TYPES.forEach(function(t){ty[t]=[0,0]});
 sh.forEach(function(x){var ok=x.r=="굿";if(ok)g++;else{m[x.r]++;if(x.ob)pen++}if(x.rt)r++;ty[x.ty][1]++;if(ok)ty[x.ty][0]++});return{g:g,n:sh.length,r:r,m:m,pen:pen,ty:ty}}
function tyb(ty){return TYPES.filter(function(t){return ty[t]&&ty[t][1]}).map(function(t){var v=ty[t];return '<div class="row sp"><span>'+t+'</span><span class="mu">'+v[0]+'/'+v[1]+' · '+pct(v[0],v[1])+'%</span></div><div class="bar"><i style="width:'+pct(v[0],v[1])+'%"></i></div>'}).join("")}
function bars(m,n){return MISS.map(function(x){return '<div class="row sp"><span>'+x+'</span><span class="mu">'+m[x]+'회 · '+pct(m[x],n)+'%</span></div><div class="bar m"><i style="width:'+pct(m[x],n)+'%"></i></div>'}).join("")}
function vDone(){var a=sum(done.sh),top=null,mx=0;MISS.forEach(function(x){if(a.m[x]>mx){mx=a.m[x];top=x}});
 return '<h1>오늘 라운드 결과</h1><div class="card"><div class="row sp"><div><div class="mu">좋은 샷</div><div class="big">'+a.g+'/'+a.n+'</div></div><div style="text-align:center"><div class="mu">루틴 완주</div><div class="big">'+pct(a.r,a.n)+'%</div></div><div style="text-align:right"><div class="mu">OB 벌타</div><div class="big">'+a.pen+'</div></div></div></div>'
 +'<div class="card"><h2>샷 종류별 좋은 샷</h2>'+tyb(a.ty)+'</div><div class="card"><h2>미스 분포</h2>'+bars(a.m,a.n)+'</div>'
 +(top?'<div class="card"><h2>다음 연습 처방: '+top+'</h2><div>'+RX[top]+'</div></div>':'<div class="card">미스 없이 마쳤습니다. 다음에는 OB 구역을 더 넓게 잡아보세요.</div>')
 +'<button class="pri" data-a="again">한 번 더</button>'}
function vLog(){var tot={n:0,g:0,r:0,pen:0,m:{},ty:{}};MISS.forEach(function(x){tot.m[x]=0});TYPES.forEach(function(t){tot.ty[t]=[0,0]});
 S.sessions.forEach(function(s){tot.n+=s.n;tot.g+=s.g;tot.r+=s.r;tot.pen+=s.pen||0;MISS.forEach(function(x){tot.m[x]+=s.m[x]||0});if(s.ty)TYPES.forEach(function(t){if(s.ty[t]){tot.ty[t][0]+=s.ty[t][0];tot.ty[t][1]+=s.ty[t][1]}})});
 var ls=S.sessions.slice(-10).reverse().map(function(s){return '<div class="li"><span>'+s.date+'</span><span class="mu">좋은 샷 '+pct(s.g,s.n)+'% · 루틴 '+pct(s.r,s.n)+'%</span></div>'}).join("")||'<div class="mu">아직 기록이 없습니다.</div>';
 return '<h1>기록</h1><div class="card"><div class="row sp"><div><div class="mu">누적 좋은 샷</div><div class="big">'+pct(tot.g,tot.n)+'%</div></div><div style="text-align:right"><div class="mu">누적 샷</div><div class="big">'+tot.n+'</div></div></div></div>'
 +'<div class="card"><h2>샷 종류별 좋은 샷</h2>'+(tot.n?tyb(tot.ty):'<div class="mu">데이터가 쌓이면 표시됩니다.</div>')+'</div>'
 +'<div class="card"><h2>누적 미스 유형</h2>'+(tot.n?bars(tot.m,tot.n):'<div class="mu">데이터가 쌓이면 표시됩니다.</div>')+'</div><div class="card"><h2>최근 세션</h2>'+ls+'</div>'+stbar()+'<button data-a="backup" style="width:100%">백업 파일 저장</button><button data-a="restore" style="width:100%;margin-top:8px">백업에서 복원</button><input type="file" id="rf" accept=".json" hidden>'}
function render(){var v=tab=="today"?vToday():tab=="run"?vRun():tab=="screen"?vScreen():vLog();document.getElementById("app").innerHTML=v;
 document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v==tab)})}
function finish(){var a=sum(run.sh);S.sessions.push({date:dk(),n:a.n,g:a.g,r:a.r,m:a.m,pen:a.pen,ty:a.ty});sv();done={sh:run.sh};run=null}
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,v=b.dataset.v;
 if(a=="tab"){tab=v;if(v!="run")done=null}
 else if(a=="chk"){var k=dk(),c=S.checks[k]||[0,0,0,0,0];c[+v]=c[+v]?0:1;S.checks[k]=c;sv()}
 else if(a=="start"){run={ph:"warm"};done=null;tab="run";window.scrollTo(0,0)}
 else if(a=="go"||a=="again"){run={ph:"play",plan:plan(),i:0,ch:[0,0,0,0,0],sh:[]};done=null;tab="run";window.scrollTo(0,0)}
 else if(a=="chip"){run.ch[+v]=run.ch[+v]?0:1}
 else if(a=="res"){var s=run.plan[run.i];run.sh.push({r:v,rt:run.ch.every(Boolean),ty:s.ty,ob:!!s.ob});run.ch=[0,0,0,0,0];run.i++;if(run.i>=run.plan.length)finish()}
 else if(a=="undo"){if(run.ph=="play"&&run.i>0){run.sh.pop();run.i--;run.ch=[0,0,0,0,0]}}
 else if(a=="quit"){if(run.ph=="play"&&run.sh.length>=3)finish();else run=null}
 else if(a=="save_round"){if(!F.holes.some(function(x){return x.score!==""})){alert("타수를 하나 이상 입력하세요.");return}
  var r=JSON.parse(JSON.stringify(F));if(!r.id)r.id="round_"+Date.now();var i=R.findIndex(function(x){return x.id==r.id});if(i<0)R.push(r);else R[i]=r;saveR(r);F=newF(r.cc)}
 else if(a=="edit"){var f=R.find(function(x){return x.id==v});if(f){F=JSON.parse(JSON.stringify(f));window.scrollTo(0,0)}}
 else if(a=="newr"){F=newF(F.cc)}
 else if(a=="backup"){var nm="golf_backup_"+dk()+".json",tx=JSON.stringify({train:S,rounds:R},null,1);
  (window.claude&&claude.use?claude.use("downloads"):Promise.resolve(null)).then(function(d){if(d)return d.save({filename:nm,data:tx});var a2=document.createElement("a");a2.href=URL.createObjectURL(new Blob([tx],{type:"application/json"}));a2.download=nm;document.body.appendChild(a2);a2.click();setTimeout(function(){a2.remove()},500)}).catch(function(){})}
 else if(a=="restore"){document.getElementById("rf").click();return}
 render()});
document.addEventListener("input",function(e){var t=e.target;if(t.dataset&&t.dataset.h!==undefined){var n=parseInt(t.value);F.holes[+t.dataset.h][t.dataset.k]=isNaN(n)?"":n;document.getElementById("tot").textContent=tt(rt(F))}else if(t.dataset&&t.dataset.f){F[t.dataset.f]=t.value}else if(t.id=="note"){S.notes[dk()]=t.value;sv()}else if(t.dataset&&t.dataset.p){S.putt[t.dataset.p]=t.value;sv()}});
var R=[],F=null,UID=null,DB=null,CLOUD=false,tmr=null,SYS=["골프존","카카오VX","SG골프","기타"];
try{R=JSON.parse(localStorage.getItem("gft_r"))||[]}catch(e){R=[]}
function newF(cc){var h=[];for(var i=0;i<9;i++)h.push({par:4,dist:"",score:"",putt:"",pen:""});return{id:"",date:dk(),cc:cc||"",sys:"골프존",holes:h,memo:""}}
F=newF();
function base(){return "data/users/"+UID}
function rt(r){var s=0,p=0,pt=0,pn=0,n=0,dm=0;r.holes.forEach(function(h){dm+=parseInt(h.dist)||0;var sc=parseInt(h.score);if(!isNaN(sc)){s+=sc;p+=(+h.par||0);n++}pt+=parseInt(h.putt)||0;pn+=parseInt(h.pen)||0});return{s:s,d:s-p,pt:pt,pn:pn,n:n,dm:dm}}
function sg(d){return(d>0?"+":"")+d}
function tt(t){return (t.dm?"총 "+t.dm+"m · ":"")+"합계 "+t.s+"타 ("+sg(t.d)+") · 퍼트 "+t.pt+" · 벌타 "+t.pn}
function saveR(r){try{localStorage.setItem("gft_r",JSON.stringify(R))}catch(e){}
 if(DB)DB.doc(base()+"/"+r.id).set(r).catch(function(){CLOUD=false;render()})}
function stat(){var ok=R.map(rt).filter(function(t){return t.n==9});if(!ok.length)return"";
 var avg=ok.reduce(function(a,t){return a+t.s},0)/ok.length,best=Math.min.apply(null,ok.map(function(t){return t.s})),m={};
 R.forEach(function(r){var t=rt(r);if(t.n==9&&r.cc){m[r.cc]=m[r.cc]||[0,0];m[r.cc][0]+=t.s;m[r.cc][1]++}});
 var cc=Object.keys(m).map(function(k){return '<div class="li"><span>'+esc(k)+'</span><span class="mu">평균 '+(m[k][0]/m[k][1]).toFixed(1)+' · '+m[k][1]+'회</span></div>'}).join("");
 return '<div class="card"><div class="row sp"><div><div class="mu">평균 (9홀)</div><div class="big">'+avg.toFixed(1)+'</div></div><div style="text-align:center"><div class="mu">베스트</div><div class="big">'+best+'</div></div><div style="text-align:right"><div class="mu">라운드</div><div class="big">'+R.length+'</div></div></div></div><div class="card"><h2>CC별 평균</h2>'+cc+'</div>'}
function stbar(){return CLOUD?'<div class="mu" style="margin-bottom:8px">☁ 계정에 저장 중입니다. 기기를 바꿔도 유지됩니다.</div>':'<div class="mu" style="margin-bottom:8px">⚠ 이 기기 브라우저에만 저장 중입니다. 기록 탭의 백업 파일을 주기적으로 저장해 두세요.</div>'}
function vScreen(){
 var rows=F.holes.map(function(h,i){return '<div class="hr"><span>'+(i+1)+'</span>'+'<select data-h="'+i+'" data-k="par">'+[3,4,5].map(function(p){return '<option'+(+h.par==p?" selected":"")+'>'+p+'</option>'}).join("")+'</select>'+[["dist","거리m"],["score","타수"],["putt","퍼트"],["pen","벌타"]].map(function(k){return '<input type="number" inputmode="numeric" data-h="'+i+'" data-k="'+k[0]+'" value="'+(h[k[0]]==null?"":h[k[0]])+'" placeholder="'+k[1]+'">'}).join("")+'</div>'}).join("");
 var ccs=[];R.forEach(function(r){if(r.cc&&ccs.indexOf(r.cc)<0)ccs.push(r.cc)});
 var dl=ccs.map(function(c){return '<option value="'+esc(c)+'">'}).join("");
 var sel=SYS.map(function(s){return '<option'+(F.sys==s?" selected":"")+'>'+s+'</option>'}).join("");
 var list=R.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0}).map(function(r){var t=rt(r);return '<div class="li" data-a="edit" data-v="'+r.id+'" style="cursor:pointer"><span>'+r.date+' · '+esc(r.cc||"코스 미입력")+'</span><span class="mu">'+t.s+'타 ('+sg(t.d)+') · 퍼트 '+t.pt+'</span></div>'}).join("")||'<div class="mu">아직 저장된 라운드가 없습니다.</div>';
 return '<h1>스크린 라운드</h1>'+stbar()+'<div class="card"><h2>'+(F.id?"라운드 수정":"9홀 기록")+'</h2>'
 +'<input class="f" type="date" data-f="date" value="'+esc(F.date)+'"><input class="f" list="ccs" data-f="cc" placeholder="CC(코스)명" value="'+esc(F.cc)+'"><datalist id="ccs">'+dl+'</datalist>'
 +'<select class="f" data-f="sys">'+sel+'</select>'
 +'<div class="hr mu"><span>홀</span><span>파</span><span>거리</span><span>타수</span><span>퍼트</span><span>벌타</span></div>'+rows
 +'<div id="tot" class="mu" style="margin:6px 0">'+tt(rt(F))+'</div><textarea data-f="memo" placeholder="복기 메모 (잘된 홀, 아쉬운 홀)">'+esc(F.memo)+'</textarea>'
 +'<button class="pri" data-a="save_round" style="margin-top:10px">'+(F.id?"수정 저장":"라운드 저장")+'</button>'+(F.id?'<button data-a="newr" style="width:100%;margin-top:8px">새 라운드 쓰기</button>':'')+'</div>'
 +stat()+'<div class="card"><h2>저장된 라운드</h2>'+list+'<div class="mu" style="margin-top:8px">누르면 수정할 수 있습니다. 삭제 기능은 없습니다.</div></div>'}
async function initDB(){try{if(!window.claude||!claude.use)return;var u=await claude.use("user"),d=await claude.use("db");if(!u||!d)return;UID=await u.id();DB=d;
 var ts=await DB.doc(base()+"/train").get();
 if(ts.exists){var rd=ts.data();if(rd&&rd.sessions){rd.putt=rd.putt||{};rd.checks=rd.checks||{};rd.notes=rd.notes||{};S=rd;try{localStorage.setItem("gft",JSON.stringify(S))}catch(e){}}}else{await DB.doc(base()+"/train").set(S)}
 var qs=await DB.collection(base()).get(),rem=[],ids={};
 qs.docs.forEach(function(x){if(x.id.indexOf("round_")==0){var o=x.data();o.id=x.id;rem.push(o);ids[x.id]=1}});
 R.forEach(function(r){if(!ids[r.id]){rem.push(r);DB.doc(base()+"/"+r.id).set(r)}});R=rem;
 try{localStorage.setItem("gft_r",JSON.stringify(R))}catch(e){}
 CLOUD=true;if(!(tab=="run"&&run&&run.ph=="play"))render()}catch(e){}}
initDB();
document.addEventListener("change",function(e){var t=e.target;
 if(t.dataset&&t.dataset.f=="cc"&&!F.id&&!F.holes.some(function(x){return x.score!==""})){var p=R.filter(function(r){return r.cc==t.value}).sort(function(a,b){return a.date<b.date?1:-1})[0];if(p){F.holes=p.holes.map(function(x){return{par:x.par,dist:x.dist==null?"":x.dist,score:"",putt:"",pen:""}});render()}}
 else if(t.id=="rf"&&t.files[0]){var fr=new FileReader();fr.onload=function(){try{var d=JSON.parse(fr.result);if(d.train&&d.train.sessions){S=d.train;S.putt=S.putt||{};S.checks=S.checks||{};S.notes=S.notes||{};sv()}
  (d.rounds||[]).forEach(function(r){var i=R.findIndex(function(x){return x.id==r.id});if(i<0)R.push(r);else R[i]=r;saveR(r)});render()}catch(err){alert("백업 파일을 읽을 수 없습니다.")}};fr.readAsText(t.files[0])}});
render();
</script></body></html>
