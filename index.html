<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스크린 9홀 기록</title>
<style>
:root{--bg:#F5F0E1;--sf:#FFFDF6;--sf2:#EEE7D3;--line:#DCD2B6;--fg:#1A261E;--mu:#6B6B58;--ac:#14452F;--ink:#F6F1E4;--soft:#E2EAD9;--red:#9E2B25;--gold:#B08D3C;
--serif:"Noto Serif KR","Nanum Myeongjo",Batang,Georgia,serif;--font:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1410;--sf:#12201A;--sf2:#192A22;--line:#2A3B31;--fg:#EEE7D2;--mu:#A9A690;--ac:#CDAA5C;--ink:#10190F;--soft:#1C2C22;--red:#E5675E;--gold:#D8B866;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1410;--sf:#12201A;--sf2:#192A22;--line:#2A3B31;--fg:#EEE7D2;--mu:#A9A690;--ac:#CDAA5C;--ink:#10190F;--soft:#1C2C22;--red:#E5675E;--gold:#D8B866;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font)}
#app{max-width:560px;margin:0 auto;padding:16px 14px 96px}
h1,h2,.big,.stp b{font-family:var(--serif)}h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--sf);border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 8px 20px -14px rgba(20,69,47,.45)}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.big{font-size:32px;font-weight:700;line-height:1.1}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--sf2);border-radius:12px;padding:10px 12px;cursor:pointer}
button.pri{background:var(--ac);color:var(--ink);border-color:var(--gold);font-weight:700;width:100%;padding:14px;font-size:16px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:12px 0}.seg button.on{background:var(--ac);color:var(--ink);border-color:var(--gold);font-weight:700}
.stp{display:flex;align-items:center;justify-content:space-between;gap:6px}.stp b{font-size:30px;min-width:44px;text-align:center}.stp button{width:54px;height:48px;font-size:22px}
.lab{margin:14px 0 6px;font-weight:700}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hcs{display:flex;gap:5px;margin-bottom:10px}.hc{flex:1;padding:10px 0;font-weight:700}.hc.d{background:var(--soft);border-color:var(--ac)}.hc.on{background:var(--ac);color:var(--ink);border-color:var(--gold)}
.f,textarea{width:100%;font:inherit;color:inherit;background:var(--sf2);border:1px solid var(--line);border-radius:10px;padding:10px}.f{margin-bottom:8px}textarea{min-height:64px;resize:vertical}
.li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.li:first-child{border-top:0}
.bar{height:8px;border-radius:5px;background:var(--sf2);overflow:hidden;margin-top:4px;width:90px}.bar i{display:block;height:100%;background:var(--ac)}
.sc{width:100%;border-collapse:collapse;font-size:13px;text-align:center}.sc td,.sc th{padding:6px 1px;border-bottom:1px solid var(--line)}.sc th{color:var(--mu);font-weight:600}
.m{display:inline-grid;place-items:center;min-width:22px;height:22px;font-weight:700}.m.b{border-radius:50%;border:1.5px solid var(--gold)}.m.e{border-radius:50%;border:3px double var(--gold)}.m.bo{border:1.5px solid var(--fg)}.m.db{border:3px double var(--fg)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--gold);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;font-size:15px;padding:10px 4px;color:var(--mu)}nav button.on{color:var(--ac);font-weight:800;box-shadow:inset 0 2px 0 var(--gold)}
#app>*{animation:up .3s ease both}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#app>*{animation:none}}
</style></head><body>
<div id="app"></div>
<nav><button data-a="tab" data-v="in">입력</button><button data-a="tab" data-v="st">기록</button></nav>
<script>
var SYS=["골프존","카카오VX","SG골프","기타"],R=[],F=null,H=0,tab="in",UID=null,DB=null,CLOUD=false;
try{R=JSON.parse(localStorage.getItem("gft_r"))||[]}catch(e){R=[]}
function dk(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pct(a,b){return b?Math.round(a/b*100):0}
function sg(d){return(d>0?"+":"")+d}
function newF(cc){var h=[];for(var i=0;i<9;i++)h.push({par:4,dist:"",score:"",putt:"",pen:"",fw:"",gir:""});return{id:"",date:dk(),cc:cc||"",sys:"골프존",holes:h,memo:""}}
F=newF();
function rt(r){var s=0,p=0,pt=0,pn=0,n=0,dm=0;r.holes.forEach(function(h){dm+=parseInt(h.dist)||0;var sc=parseInt(h.score);if(!isNaN(sc)){s+=sc;p+=(+h.par||0);n++}pt+=parseInt(h.putt)||0;pn+=parseInt(h.pen)||0});return{s:s,d:s-p,pt:pt,pn:pn,n:n,dm:dm}}
function tt(t){return (t.dm?"총 "+t.dm+"m · ":"")+t.n+"홀 "+t.s+"타 ("+sg(t.d)+") · 퍼트 "+t.pt+" · 벌타 "+t.pn}
function lt(){return R.slice().sort(function(a,b){return a.date<b.date?1:-1})[0]}
function saveR(r){try{localStorage.setItem("gft_r",JSON.stringify(R))}catch(e){}
 if(DB)DB.doc("data/users/"+UID+"/"+r.id).set(r).catch(function(){CLOUD=false;render()})}
function mk(sc,p){if(sc===""||sc==null)return"";var d=sc-p,c=d<=-2?"m e":d==-1?"m b":d==1?"m bo":d>=2?"m db":"";return c?'<span class="'+c+'">'+sc+'</span>':sc}
function scard(r){var t=rt(r),hd="",pr="",sc="",pt="",P=0;r.holes.forEach(function(h,i){hd+='<th>'+(i+1)+'</th>';pr+='<td>'+h.par+'</td>';sc+='<td>'+mk(h.score,+h.par)+'</td>';pt+='<td>'+(h.putt===""||h.putt==null?"":h.putt)+'</td>';P+=+h.par||0});
 return '<table class="sc"><tr><th>홀</th>'+hd+'<th>계</th></tr><tr><th>파</th>'+pr+'<td>'+P+'</td></tr><tr><th>타수</th>'+sc+'<td><b>'+t.s+'</b></td></tr><tr><th>퍼트</th>'+pt+'<td>'+t.pt+'</td></tr></table>'}
function agg(){var a={n:0,fw:[0,0],fl:0,fr:0,gir:[0,0],pt:[0,0],t3:0,pn:0,sv:0,bd:0,bo:0,db:0,P:{3:[0,0],4:[0,0],5:[0,0]},H:[]};for(var i=0;i<9;i++)a.H.push([0,0]);
 R.forEach(function(r){r.holes.forEach(function(h,i){var s=parseInt(h.score);if(isNaN(s))return;var p=+h.par||4,d=s-p;a.n++;
  if(d<=0)a.sv++;if(d<0)a.bd++;if(d==1)a.bo++;if(d>=2)a.db++;if(a.P[p]){a.P[p][0]+=d;a.P[p][1]++}if(a.H[i]){a.H[i][0]+=d;a.H[i][1]++}
  var q=parseInt(h.putt);if(!isNaN(q)){a.pt[0]+=q;a.pt[1]++;if(q>=3)a.t3++}a.pn+=parseInt(h.pen)||0;
  if(p!=3&&h.fw){a.fw[1]++;if(h.fw=="안착")a.fw[0]++;if(h.fw=="좌")a.fl++;if(h.fw=="우")a.fr++}
  if(h.gir){a.gir[1]++;if(h.gir=="O")a.gir[0]++}})});return a}
function li(a,b){return '<div class="li"><span>'+a+'</span><b>'+b+'</b></div>'}
function avg(x){return x[1]?sg(+(x[0]/x[1]).toFixed(1)):"—"}
function grp(key){var m={};R.forEach(function(r){var t=rt(r);if(t.n==9&&r[key]){m[r[key]]=m[r[key]]||[0,0];m[r[key]][0]+=t.s;m[r[key]][1]++}});
 return Object.keys(m).map(function(k){return li(esc(k),(m[k][0]/m[k][1]).toFixed(1)+"타 · "+m[k][1]+"회")}).join("")}
function trend(){var a=R.filter(function(r){return rt(r).n==9}).sort(function(x,y){return x.date<y.date?-1:1}).slice(-10).map(function(r){return rt(r).s});if(a.length<2)return"";
 var lo=Math.min.apply(null,a)-1,hi=Math.max.apply(null,a)+1,pts=a.map(function(v,i){return[10+i*(280/(a.length-1)),12+(hi-v)/(hi-lo)*60]});
 return '<div class="card"><h2>스코어 추이</h2><svg viewBox="0 0 300 90" width="100%"><polyline points="'+pts.map(function(p){return p.join(",")}).join(" ")+'" style="fill:none;stroke:var(--ac)" stroke-width="2"/>'+pts.map(function(p,i){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" style="fill:var(--gold)"/><text x="'+p[0]+'" y="'+(p[1]-7)+'" font-size="9" text-anchor="middle" style="fill:var(--mu)">'+a[i]+'</text>'}).join("")+'</svg></div>'}
function stbar(){return CLOUD?'<div class="mu" style="margin-bottom:8px">☁ 계정에 저장 중입니다. 기기를 바꿔도 유지됩니다.</div>':'<div class="mu" style="margin-bottom:8px">⚠ 이 기기 브라우저에만 저장 중입니다. 백업 파일을 주기적으로 저장해 두세요.</div>'}
function seg(k,arr,cur){return '<div class="seg">'+arr.map(function(o){return '<button class="'+(cur==o[0]?"on":"")+'" data-a="seg" data-k="'+k+'" data-v="'+o[0]+'">'+o[1]+'</button>'}).join("")+'</div>'}
function stp(k,label,v){return '<div><div class="lab">'+label+'</div><div class="stp"><button data-a="step" data-k="'+k+'" data-v="-1">−</button><b>'+(v===""||v==null?"—":v)+'</b><button data-a="step" data-k="'+k+'" data-v="1">+</button></div></div>'}
function vIn(){var h=F.holes[H],p=+h.par,ccs=[];R.forEach(function(r){if(r.cc&&ccs.indexOf(r.cc)<0)ccs.push(r.cc)});
 var chips=F.holes.map(function(x,i){return '<button class="hc '+(i==H?"on":x.score!==""?"d":"")+'" data-a="hole" data-v="'+i+'">'+(i+1)+'</button>'}).join("");
 return '<h1>'+(F.id?"라운드 수정":"스크린 9홀 기록")+'</h1><div class="card"><input class="f" type="date" data-f="date" value="'+esc(F.date)+'"><input class="f" list="ccs" data-f="cc" placeholder="CC(코스)명" value="'+esc(F.cc)+'"><datalist id="ccs">'+ccs.map(function(c){return '<option value="'+esc(c)+'">'}).join("")+'</datalist>'
 +'<select class="f" data-f="sys" style="margin:0">'+SYS.map(function(s){return '<option'+(F.sys==s?" selected":"")+'>'+s+'</option>'}).join("")+'</select></div>'
 +'<div class="hcs">'+chips+'</div><div class="card"><h2>'+(H+1)+'번 홀</h2>'
 +'<div class="lab">파</div>'+seg("par",[[3,"파3"],[4,"파4"],[5,"파5"]],p)
 +'<div class="lab">총 거리 (m)</div><input class="f" type="number" inputmode="numeric" data-k="dist" placeholder="예: 360" value="'+esc(h.dist)+'" style="margin:0">'
 +stp("score","타수",h.score)+'<div class="g2">'+stp("putt","퍼트",h.putt)+stp("pen","벌타",h.pen)+'</div>'
 +(p!=3?'<div class="lab">티샷</div>'+seg("fw",[["안착","페어웨이"],["좌","좌 미스"],["우","우 미스"]],h.fw):'')
 +'<div class="lab">그린 적중 (규정 타수 안에 온)</div>'+seg("gir",[["O","적중"],["X","실패"]],h.gir)
 +'<div class="row" style="margin-top:14px"><button data-a="prev" style="flex:1"'+(H==0?" disabled":"")+'>이전 홀</button><button data-a="next" style="flex:1"'+(H==8?" disabled":"")+'>다음 홀</button></div></div>'
 +'<div class="card"><div class="mu" id="tot">'+tt(rt(F))+'</div><textarea data-f="memo" placeholder="복기 메모 (잘된 홀, 아쉬운 홀)" style="margin-top:8px">'+esc(F.memo)+'</textarea></div>'
 +'<button class="pri" data-a="save_round">'+(F.id?"수정 저장":"라운드 저장")+'</button>'+(F.id?'<button data-a="newr" style="width:100%;margin-top:8px">새 라운드 쓰기</button>':'')}
function rec10(){var rs=R.filter(function(r){return rt(r).n==9}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0}).slice(0,10),k=rs.length;
 if(!k)return '<div class="card"><h2>최근 10경기 평균</h2><div class="mu">9홀을 모두 입력한 라운드가 쌓이면 자동으로 계산됩니다.</div></div>';
 var T=rs.map(rt),sc=T.map(function(t){return t.s}),df=T.map(function(t){return t.d}),sum=function(a){return a.reduce(function(x,y){return x+y},0)};
 var h="3경기 이상 필요";
 if(k>=3){var n=k<=5?1:k<=8?2:3,adj=k==3?-2:(k==4||k==6)?-1:0,low=df.map(function(d){return d*2}).sort(function(a,b){return a-b}).slice(0,n);h=(sum(low)/n*0.96+adj).toFixed(1)}
 var half=k>=6?Math.floor(k/2):0,tr="";
 if(half){var rc=sum(sc.slice(0,half))/half,pv=sum(sc.slice(half))/(k-half);tr=li("최근 "+half+"경기 vs 이전 "+(k-half)+"경기 (−이면 향상)",rc.toFixed(1)+" vs "+pv.toFixed(1)+" ("+sg(+(rc-pv).toFixed(1))+")")}
 return '<div class="card"><h2>최근 '+k+'경기 평균</h2>'+li("평균 타수 (9홀)",(sum(sc)/k).toFixed(1))+li("파 대비 평균",sg(+(sum(df)/k).toFixed(1)))+li("18홀 환산 평균",(sum(sc)/k*2).toFixed(1))+li("평균 퍼트 (9홀)",(sum(T.map(function(t){return t.pt}))/k).toFixed(1))+li("베스트 / 워스트",Math.min.apply(null,sc)+" / "+Math.max.apply(null,sc))+tr+li("추정 핸디캡",h)+'<div class="mu" style="margin-top:6px">코스 레이팅과 슬로프 없이 계산한 관리용 추정치입니다. 공식 핸디캡이 아닙니다.</div></div>'}
function vSt(){var tools=stbar()+'<button data-a="backup" style="width:100%">백업 파일 저장</button><button data-a="restore" style="width:100%;margin-top:8px">백업에서 복원</button><input type="file" id="rf" accept=".json" hidden>';
 if(!R.length)return '<h1>기록</h1><div class="card mu">아직 저장된 라운드가 없습니다. 입력 탭에서 9홀을 기록해 보세요.</div>'+tools;
 var ok=R.map(rt).filter(function(t){return t.n==9}),A=agg(),L=lt(),
 av=ok.length?(ok.reduce(function(a,t){return a+t.s},0)/ok.length).toFixed(1):"—",best=ok.length?Math.min.apply(null,ok.map(function(t){return t.s})):"—";
 var hole=A.H.map(function(x,i){var w=x[1]?Math.max(4,Math.min(100,(x[0]/x[1]+.5)*50)):0;return '<div class="li"><span>'+(i+1)+'번 홀 <span class="mu">('+x[1]+'회)</span></span><span class="row"><b>'+avg(x)+'</b><span class="bar"><i style="width:'+w+'%"></i></span></span></div>'}).join("");
 var list=R.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0}).map(function(r){var t=rt(r);return '<div class="li" data-a="edit" data-v="'+r.id+'" style="cursor:pointer"><span>'+r.date+' · '+esc(r.cc||"코스 미입력")+'</span><span class="mu">'+t.s+'타 ('+sg(t.d)+') · 퍼트 '+t.pt+'</span></div>'}).join("");
 return '<h1>기록</h1><div class="card"><div class="row sp"><div><div class="mu">평균 (9홀)</div><div class="big">'+av+'</div></div><div style="text-align:center"><div class="mu">베스트</div><div class="big">'+best+'</div></div><div style="text-align:right"><div class="mu">라운드</div><div class="big">'+R.length+'</div></div></div></div>'
 +rec10()+'<div class="card"><h2>상세 지표</h2>'
 +li("페어웨이 안착",A.fw[1]?A.fw[0]+"/"+A.fw[1]+" ("+pct(A.fw[0],A.fw[1])+"%) · 좌 "+A.fl+" · 우 "+A.fr:"기록 없음")
 +li("그린 적중(GIR)",A.gir[1]?A.gir[0]+"/"+A.gir[1]+" ("+pct(A.gir[0],A.gir[1])+"%)":"기록 없음")
 +li("홀당 퍼트",A.pt[1]?(A.pt[0]/A.pt[1]).toFixed(2)+" · 3퍼트 이상 "+A.t3+"회":"기록 없음")
 +li("파 세이브(파 이하)",pct(A.sv,A.n)+"% ("+A.sv+"/"+A.n+"홀)")
 +li("버디 이상 / 보기 / 더블 이상",A.bd+" / "+A.bo+" / "+A.db)+li("벌타 합계",A.pn)+'</div>'
 +'<div class="card"><h2>파별 평균 (파 대비)</h2>'+li("파3",avg(A.P[3]))+li("파4",avg(A.P[4]))+li("파5",avg(A.P[5]))+'</div>'
 +'<div class="card"><h2>홀 번호별 평균 (파 대비)</h2>'+hole+'</div>'
 +(grp("cc")?'<div class="card"><h2>CC별 평균</h2>'+grp("cc")+'</div>':'')+(grp("sys")?'<div class="card"><h2>시스템별 평균</h2>'+grp("sys")+'</div>':'')
 +trend()+'<div class="card"><h2>최근 스코어카드</h2><div class="mu" style="margin-bottom:6px">'+L.date+' · '+esc(L.cc||"코스 미입력")+'</div>'+scard(L)+'<div class="mu" style="margin-top:8px">◯ 버디 ◎ 이글 □ 보기 ▣ 더블 이상</div></div>'
 +'<div class="card"><h2>저장된 라운드</h2>'+list+'<div class="mu" style="margin-top:8px">누르면 수정할 수 있습니다. 삭제 기능은 없습니다.</div></div>'+tools}
function render(){document.getElementById("app").innerHTML=tab=="in"?vIn():vSt();document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v==tab)})}
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b||b.disabled)return;var a=b.dataset.a,v=b.dataset.v,k=b.dataset.k,h=F.holes[H];
 if(a=="tab"){tab=v;window.scrollTo(0,0)}
 else if(a=="hole"){H=+v}
 else if(a=="prev"){H=Math.max(0,H-1)}else if(a=="next"){H=Math.min(8,H+1)}
 else if(a=="seg"){if(k=="par"){h.par=+v;if(+v==3)h.fw=""}else h[k]=h[k]==v?"":v}
 else if(a=="step"){var d=+v,cur=h[k],base=k=="score"?+h.par:k=="putt"?2:0;if(cur===""||cur==null)cur=d>0?base:Math.max(0,base+d);else cur=Math.max(k=="score"?1:0,+cur+d);h[k]=cur}
